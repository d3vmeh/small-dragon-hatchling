<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BDH Neuron Scope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap">
<style>
:root{
  --paper:#F4F6F5; --panel:#FFFFFF; --sunk:#EAEEEC;
  --ink:#14181B; --ink2:#4B575D; --ink3:#7C8A8F;
  --line:#D6DEDC; --line2:#C2CDCA;
  --excite:#0E7C7B; --inhibit:#B4531F;
  --halo:rgba(14,124,123,.14);
  --shadow:0 1px 2px rgba(20,24,27,.06),0 8px 24px rgba(20,24,27,.06);
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1315; --panel:#171E20; --sunk:#121819;
    --ink:#E9EFED; --ink2:#A3B1B3; --ink3:#75868A;
    --line:#27302F; --line2:#33403F;
    --excite:#43B8B0; --inhibit:#E08A4E;
    --halo:rgba(67,184,176,.16);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1315; --panel:#171E20; --sunk:#121819;
  --ink:#E9EFED; --ink2:#A3B1B3; --ink3:#75868A;
  --line:#27302F; --line2:#33403F;
  --excite:#43B8B0; --inhibit:#E08A4E;
  --halo:rgba(67,184,176,.16);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.5;
}
header{
  display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;
  padding:18px 24px 14px; border-bottom:1px solid var(--line); background:var(--panel);
}
h1{
  font-family:"IBM Plex Serif",Georgia,serif; font-weight:600; font-size:21px;
  margin:0; letter-spacing:-.01em;
}
.sub{color:var(--ink2); font-size:12.5px}
.sub b{color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums}
.spacer{flex:1}
button,select,input[type=search]{
  font:inherit; color:var(--ink); background:var(--panel);
  border:1px solid var(--line2); border-radius:5px; padding:5px 9px;
}
button{cursor:pointer}
button:hover{border-color:var(--ink3)}
button[aria-pressed="true"]{background:var(--halo); border-color:var(--excite); color:var(--ink)}
:focus-visible{outline:2px solid var(--excite); outline-offset:2px}
main{display:grid; grid-template-columns:minmax(0,1fr) 380px; height:calc(100% - 62px)}
@media (max-width:900px){ main{grid-template-columns:1fr; height:auto} #stage{height:60vh} }

#stage{position:relative; background:var(--sunk); overflow:hidden}
canvas{display:block; width:100%; height:100%; cursor:grab}
canvas.drag{cursor:grabbing}
.controls{
  position:absolute; left:16px; top:16px; display:flex; gap:8px; flex-wrap:wrap;
  align-items:center; background:var(--panel); border:1px solid var(--line);
  border-radius:7px; padding:8px 10px; box-shadow:var(--shadow); max-width:calc(100% - 32px);
}
.controls label{font-size:12px; color:var(--ink2); display:flex; align-items:center; gap:6px}
input[type=range]{accent-color:var(--excite); width:120px}
.legend{
  position:absolute; left:16px; bottom:16px; background:var(--panel); border:1px solid var(--line);
  border-radius:7px; padding:9px 11px; font-size:12px; color:var(--ink2); box-shadow:var(--shadow);
}
.legend .row{display:flex; align-items:center; gap:7px; margin-top:4px}
.legend .row:first-child{margin-top:0}
.swatch{width:20px; height:3px; border-radius:2px; display:inline-block}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;border:1.5px solid var(--ink3)}
.count{position:absolute; right:16px; top:16px; font-size:12px; color:var(--ink2);
  background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:6px 10px;
  box-shadow:var(--shadow); font-variant-numeric:tabular-nums}

aside{border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; padding:20px}
.eyebrow{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink3)}
.nlabel{font-family:"IBM Plex Serif",Georgia,serif; font-size:18px; line-height:1.35; margin:6px 0 12px;
  text-wrap:balance}
.facts{display:grid; grid-template-columns:auto 1fr; gap:3px 14px; font-size:12.5px; margin-bottom:18px}
.facts dt{color:var(--ink3)}
.facts dd{margin:0; font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
h2{font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink3);
  margin:20px 0 8px; font-weight:600}
.ctx{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; line-height:1.65;
  border-top:1px solid var(--line); padding:7px 0; color:var(--ink2); word-break:break-word}
.ctx:last-child{border-bottom:1px solid var(--line)}
.ctx b{color:var(--ink); background:var(--halo); padding:1px 2px; border-radius:2px;
  box-shadow:inset 0 -2px 0 var(--excite); font-weight:500}
.wire{display:grid; grid-template-columns:1fr 86px; gap:6px 10px; align-items:center; font-size:12px}
.wname{font-family:"IBM Plex Mono",ui-monospace,monospace; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; cursor:pointer; color:var(--ink)}
.wname:hover{text-decoration:underline}
.wname span{color:var(--ink3)}
.bar{position:relative; height:9px; background:var(--sunk); border-radius:2px}
.bar i{position:absolute; top:0; bottom:0; display:block; border-radius:2px}
.bar .mid{position:absolute; top:-2px; bottom:-2px; left:50%; width:1px; background:var(--line2)}
.empty{color:var(--ink3); font-size:12.5px; font-style:italic}
footer{padding:14px 24px 22px; color:var(--ink3); font-size:11.5px; border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>BDH Neuron Scope</h1>
  <div class="sub">BPE-100M base &middot; <b>6</b> layers &times; <b>4</b> heads &middot;
    <b>16,384</b> neurons per head &middot; <b>203</b> labelled from <b>200,000</b> characters</div>
  <div class="spacer"></div>
  <button id="theme" title="Switch theme">Theme</button>
</header>

<main>
  <div id="stage">
    <div class="controls">
      <label>Head
        <select id="head">
          <option value="all">all</option>
          <option value="0">0</option><option value="1">1</option>
          <option value="2">2</option><option value="3">3</option>
        </select>
      </label>
      <label>Link strength
        <input type="range" id="thr" min="50" max="200" value="130">
        <span id="thrv" style="font-family:'IBM Plex Mono',monospace">1.30&times;</span>
      </label>
      <input type="search" id="q" placeholder="search labels" style="width:150px">
      <button id="reheat" title="Re-run the layout">Shake</button>
    </div>
    <div class="count" id="count"></div>
    <div class="legend">
      <div class="row"><span class="swatch" style="background:var(--excite)"></span> excites the next pulse</div>
      <div class="row"><span class="swatch" style="background:var(--inhibit)"></span> suppresses it</div>
      <div class="row"><span class="dot"></span> size = how often it fires</div>
    </div>
    <canvas id="cv"></canvas>
  </div>

  <aside id="panel"></aside>
</main>

<footer id="foot"></footer>

    (filt.head === 'all' || String(n.head) === filt.head) &&
    (!filt.q || n.label.toLowerCase().includes(filt.q)));
}
function visibleEdges(vis) {
  const s = new Set(vis.map(n => n.key));
  return edges.filter(e => s.has(e.s.key) && s.has(e.t.key) &&
    Math.abs(e.w) >= DATA.thr[e.h] * filt.thr);
}
let VN = [], VE = [];
function refilter(reheat) {
  VN = visibleNodes(); VE = visibleEdges(VN);
  const deg = new Map();
  VE.forEach(e => { deg.set(e.s.key, (deg.get(e.s.key) || 0) + 1); deg.set(e.t.key, (deg.get(e.t.key) || 0) + 1); });
  VN.forEach(n => n.deg = deg.get(n.key) || 0);
  document.getElementById('count').textContent =
    `${VN.length} neurons · ${VE.length} links`;
  if (reheat) { alpha = 1; tick(); }
}
function step() {
  const k = 0.0022;
  for (let i = 0; i < VN.length; i++) {                   // pairwise repulsion
    const a = VN[i];
    for (let j = i + 1; j < VN.length; j++) {
      const b = VN[j];
      let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
      if (d2 < 1) { d2 = 1; dx = (Math.random() - .5); dy = (Math.random() - .5); }
      if (d2 > 160000) continue;
      const f = 2600 / d2, d = Math.sqrt(d2);
      const fx = f * dx / d, fy = f * dy / d;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
  }
  VE.forEach(e => {                                       // springs, stronger for stronger links
    const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
    const d = Math.hypot(dx, dy) || 1, want = 120;
    const f = (d - want) * 0.02 * Math.min(1, Math.abs(e.w) / DATA.thr[e.h]);
    const fx = f * dx / d, fy = f * dy / d;
    e.s.vx += fx; e.s.vy += fy; e.t.vx -= fx; e.t.vy -= fy;
  });
  const C = headCentres();
  VN.forEach(n => {                                       // each head is pulled to its own centre
    const c = C[n.head] || C[0];
    n.vx += (c[0] - n.x) * k; n.vy += (c[1] - n.y) * k;
    if (n === drag) { n.vx = n.vy = 0; return; }
    n.vx *= 0.86; n.vy *= 0.86;
    n.x += n.vx * alpha; n.y += n.vy * alpha;
    n.x = Math.max(24, Math.min(W - 24, n.x)); n.y = Math.max(24, Math.min(H - 24, n.y));
  });
  alpha *= 0.996;
}
const radius = n => 5 + Math.sqrt(n.rate * 100) * 4.5;
function draw() {
  const exc = css('--excite'), inh = css('--inhibit'), ink = css('--ink'), line = css('--line2');
  ctx2.clearRect(0, 0, W, H);
  const focus = hover || sel;
  const near = new Set();
  if (focus) { near.add(focus.key); VE.forEach(e => { if (e.s === focus) near.add(e.t.key); if (e.t === focus) near.add(e.s.key); }); }
  VE.forEach(e => {
    const on = !focus || e.s === focus || e.t === focus;
    ctx2.globalAlpha = on ? Math.min(.8, .22 + Math.abs(e.w) * 2.2) : .12;
    ctx2.strokeStyle = e.w > 0 ? exc : inh;
    ctx2.lineWidth = on ? Math.max(.7, Math.abs(e.w) * 9) : .6;
    ctx2.beginPath(); ctx2.moveTo(e.s.x, e.s.y); ctx2.lineTo(e.t.x, e.t.y); ctx2.stroke();
  });
  ctx2.globalAlpha = 1;
  VN.forEach(n => {
    const dim = focus && !near.has(n.key);
    const r = radius(n);
    ctx2.globalAlpha = dim ? .45 : 1;
    ctx2.beginPath(); ctx2.arc(n.x, n.y, r, 0, 6.2832);
    ctx2.fillStyle = n === sel ? exc : css('--panel');
    ctx2.fill();
    ctx2.lineWidth = n === sel ? 2.5 : 1.5;
    ctx2.strokeStyle = n === sel ? exc : (n.deg ? line : css('--line'));
    ctx2.stroke();
    if (!dim && (n === focus || near.has(n.key) || VN.length < 24)) {
      ctx2.globalAlpha = n === focus ? 1 : .8;
      ctx2.fillStyle = ink;
      ctx2.font = '500 11px "IBM Plex Mono", monospace';
      ctx2.textAlign = 'center';
      ctx2.fillText(n.head + ':' + n.id, n.x, n.y - r - 5);
    }
  });
  ctx2.globalAlpha = 1;
}
function tick() { if (alpha > 0.02) { step(); requestAnimationFrame(tick); } draw(); }

function hit(x, y) {
  for (let i = VN.length - 1; i >= 0; i--) {
    const n = VN[i];
    if ((x - n.x) ** 2 + (y - n.y) ** 2 <= (radius(n) + 4) ** 2) return n;
  }
  return null;
}
const esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
function select(n) {
  sel = n; draw();
  if (!n) { panel.innerHTML = '<p class="empty">Pick a neuron in the graph.</p>'; return; }
  const links = edges.filter(e => e.s === n || e.t === n)
    .sort((a, b) => Math.abs(b.w) - Math.abs(a.w)).slice(0, 8);
  const maxw = Math.max(...links.map(l => Math.abs(l.w)), DATA.thr[n.head]);
  panel.innerHTML = `
    <div class="eyebrow">Neuron ${n.head}:${n.id}</div>
    <div class="nlabel">${esc(n.label)}</div>
    <dl class="facts">
      <dt>head</dt><dd>${n.head}</dd>
      <dt>layers</dt><dd>${n.layers.join(', ')}</dd>
      <dt>fires on</dt><dd>${(n.rate * 100).toFixed(2)}% of positions</dd>
      <dt>mean strength</dt><dd>${n.strength.toFixed(2)}</dd>
      <dt>label source</dt><dd>${n.src.join(' + ')}${n.conf ? ' · ' + n.conf : ''}</dd>
    </dl>
    <h2>Where it fired hardest</h2>
    ${n.ctx.map(c => `<div class="ctx">${esc(c.pre)}<b>${esc(c.atom)}</b>${esc(c.post)}</div>`).join('')}
    <h2>Wiring</h2>
    ${links.length ? `<div class="wire">${links.map(l => {
      const other = l.s === n ? l.t : l.s, out = l.s === n;
      const frac = Math.abs(l.w) / maxw, pos = l.w > 0;
      return `<div class="wname" data-key="${other.key}" tabindex="0">${out ? '→' : '←'} ${other.head}:${other.id}
                <span>${esc(other.label.slice(0, 34))}</span></div>
              <div class="bar"><span class="mid"></span>
                <i style="${pos ? 'left:50%' : 'right:50%'};width:${(frac * 50).toFixed(1)}%;
                   background:${pos ? 'var(--excite)' : 'var(--inhibit)'}"></i></div>`;
    }).join('')}</div>
    <p class="empty" style="margin-top:10px">Strong here means |weight| above ${DATA.thr[n.head]},
       the 99th percentile for head ${n.head}. Arrows point the way the signal travels.</p>`
    : `<p class="empty">No links to other labelled neurons above the current strength.</p>`}`;
  panel.querySelectorAll('.wname').forEach(el => {
    const go = () => { const t = byKey.get(el.dataset.key); if (t) { select(t); alpha = .35; tick(); } };
    el.onclick = go;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });
}
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (drag) { drag.x = x; drag.y = y; draw(); return; }
  const h = hit(x, y);
  if (h !== hover) { hover = h; cv.title = h ? h.label : ''; draw(); }
});
cv.addEventListener('mousedown', e => {
  const r = cv.getBoundingClientRect(), n = hit(e.clientX - r.left, e.clientY - r.top);
  if (n) { drag = n; cv.classList.add('drag'); select(n); }
});
addEventListener('mouseup', () => { if (drag) { drag = null; cv.classList.remove('drag'); alpha = .3; tick(); } });
cv.addEventListener('mouseleave', () => { hover = null; draw(); });

document.getElementById('head').onchange = e => { filt.head = e.target.value; refilter(true); };
document.getElementById('q').oninput = e => { filt.q = e.target.value.toLowerCase(); refilter(true); };
document.getElementById('thr').oninput = e => {
  filt.thr = e.target.value / 100;
  document.getElementById('thrv').textContent = filt.thr.toFixed(2) + '×';
  refilter(false); draw();
};
document.getElementById('reheat').onclick = () => { layoutSeed(); alpha = 1; tick(); };
document.getElementById('theme').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  draw();
};
addEventListener('resize', () => { resize(); layoutSeed(); alpha = .8; tick(); });

document.getElementById('foot').textContent =
  `Labels are an LLM's reading of eight firing contexts per neuron, spot-checked; treat them as observations. Wiring is decoder × encoder within a head: ` +
  `heads are separate circuits here, which is why the graph falls into groups. ` +
  `Sources: scope_${DATA.meta.tag}.json, scope_labels_${DATA.meta.tag}{,_v2}.json, wiring_graph_${DATA.meta.tag}.json.`;

resize(); layoutSeed(); refilter(false);
select(nodes.find(n => n.head === 2 && n.id === 14586) || nodes[0]);
alpha = 1; tick();
</script>
</body>
</html>
